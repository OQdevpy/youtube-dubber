# One container: the API and the web player on http://<host>:9988/
#   docker compose up -d --build
#
# On a server where YouTube answers "Sign in to confirm you're not a bot",
# also start the free Cloudflare WARP proxy and route YouTube through it:
#   1. in backend/.env set  YOUTUBE_PROXY=socks5h://warp:1080
#   2. docker compose --profile warp up -d --build
services:
  dubber:
    build: ./backend
    container_name: youtube-dubber
    ports:
      # reachable from other machines; set DUB_PASSWORD in backend/.env on a server
      - "9988:9988"
    env_file:
      - ./backend/.env
    volumes:
      - dub-audio:/data/audio # generated MP3s only
      # YouTube cookies for servers that hit the bot check (see .env.example):
      # create backend/cookies.txt, uncomment, and set YOUTUBE_COOKIES=/app/cookies.txt
      # - ./backend/cookies.txt:/app/cookies.txt
    restart: unless-stopped

  # Optional (profile "warp"): Cloudflare WARP as a SOCKS5/HTTP proxy on warp:1080.
  # Deliberately NOT published on the host, so the server doesn't become an open proxy.
  warp:
    image: caomingjun/warp
    container_name: youtube-dubber-warp
    profiles: ["warp"]
    restart: unless-stopped
    environment:
      - WARP_SLEEP=2
    device_cgroup_rules:
      - "c 10:200 rwm"
    cap_add:
      - MKNOD
      - AUDIT_WRITE
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - warp-data:/var/lib/cloudflare-warp

volumes:
  dub-audio:
  warp-data:
